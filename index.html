<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SGX V-Commerce Sandbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Courier New', monospace;
            color: #FDCC0D;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            border-left: 4px solid #00FFFF;
            padding-left: 15px;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        h2 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #32527B;
            font-weight: bold;
        }
        .blink {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        
        /* Style VR Button to match SGX Brand */
        #VRButton {
            background: rgba(50, 82, 123, 0.8) !important;
            border: 1px solid #00FFFF !important;
            color: #00FFFF !important;
            font-family: 'Courier New', monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3) !important;
            left: calc(50% - 120px) !important;
            width: 110px !important;
        }

        /* Style AR Button to match SGX Brand */
        #ARButton {
            background: rgba(50, 82, 123, 0.8) !important;
            border: 1px solid #FDCC0D !important;
            color: #FDCC0D !important;
            font-family: 'Courier New', monospace !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            box-shadow: 0 0 15px rgba(253, 204, 13, 0.3) !important;
            left: calc(50% + 10px) !important;
            width: 110px !important;
        }
    </style>
</head>
<body>
    <div id="hud">
        <h2>SGX V-COMMERCE</h2>
        <p>POWERED BY SPATIALGINEERS</p>
        <p id="status-text" class="blink" style="color: #00FFFF; margin-top: 10px;">> DOWNLOADING 3D ASSETS...</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- 1. CORE ARCHITECTURE & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.04);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 3.5); // Average human height

        // Habilitamos alpha: true para poder tener fondos transparentes en AR (Passthrough)
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true; // ENABLING WEBXR
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Añadimos ambos botones al entorno
        document.body.appendChild(VRButton.createButton(renderer));
        document.body.appendChild(ARButton.createButton(renderer));

        // Controls for desktop preview before entering VR/AR
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.4, -1.5);
        controls.update();

        // --- 2. LIGHTING & PBR ENVIRONMENT (SGX AESTHETIC) ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        
        scene.add(new THREE.AmbientLight(0x1a1a1a));
        
        const cyanLight = new THREE.PointLight(0x00FFFF, 20, 10);
        cyanLight.position.set(-2, 3, 0);
        scene.add(cyanLight);

        const goldLight = new THREE.PointLight(0xFDCC0D, 15, 10);
        goldLight.position.set(2, 0, 1);
        scene.add(goldLight);

        // Grid Floor
        const grid = new THREE.GridHelper(40, 80, 0x32527B, 0x111111);
        grid.position.y = 0;
        scene.add(grid);

        // Futuristic Pedestal
        const pedestalGeo = new THREE.CylinderGeometry(0.7, 0.8, 0.1, 32);
        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
        const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal.position.set(0, 0.8, -1.5);
        scene.add(pedestal);

        // Neon Holographic Ring on Pedestal
        const ringGeo = new THREE.TorusGeometry(0.7, 0.015, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00FFFF });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(0, 0.85, -1.5);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // --- 2.5 ENVIRONMENT TOGGLER (FOR AR/VR XR MODES) ---
        renderer.xr.addEventListener('sessionstart', () => {
            const session = renderer.xr.getSession();
            
            // Evaluamos el tipo de sesión para apagar/encender el entorno
            if (session && session.mode === 'immersive-ar') {
                // Eliminar entorno virtual para dejar pasar la cámara real (Passthrough AR)
                scene.background = null;
                scene.fog = null;
                grid.visible = false;
                pedestal.visible = false;
                ring.visible = false;
            } else {
                // Mantener el entorno virtual para la inmersión total (VR)
                scene.background = new THREE.Color(0x050505);
                scene.fog = new THREE.FogExp2(0x050505, 0.04);
                grid.visible = true;
                pedestal.visible = true;
                ring.visible = true;
            }
        });

        renderer.xr.addEventListener('sessionend', () => {
            // Restaurar entorno virtual al volver a escritorio/móvil
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.04);
            grid.visible = true;
            pedestal.visible = true;
            ring.visible = true;
        });

        // --- 3. LOAD THE SGX 3D MODEL ---
        const productGroup = new THREE.Group();
        productGroup.position.set(0, 1.8, -1.5); // Floating higher up, cool vibe
        scene.add(productGroup);

        // Setup Decoders for Web Compressed Models (Draco, KTX2, Meshopt)
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');

        const ktx2Loader = new KTX2Loader()
            .setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/')
            .detectSupport(renderer);

        const gltfLoader = new GLTFLoader()
            .setCrossOrigin('anonymous')
            .setDRACOLoader(dracoLoader)
            .setKTX2Loader(ktx2Loader)
            .setMeshoptDecoder(MeshoptDecoder);

        let loadedModel = null;

        gltfLoader.load(
            'https://static.wixstatic.com/3d/fe81a7_cf1ed4e58d0048efa955f39d347a9466.glb',
            (gltf) => {
                loadedModel = gltf.scene;

                // Absolute Centering & Scaling Math
                const box = new THREE.Box3().setFromObject(loadedModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3()).length();

                // Center pivot
                loadedModel.position.x += (loadedModel.position.x - center.x);
                loadedModel.position.y += (loadedModel.position.y - center.y);
                loadedModel.position.z += (loadedModel.position.z - center.z);

                // Scale adjusted to 1.2 as requested
                const scale = 1.2 / size; 
                loadedModel.scale.set(scale, scale, scale);

                productGroup.add(loadedModel);
                
                // Update HUD
                document.getElementById('status-text').innerText = '> AWAITING XR INITIATION';
            },
            undefined,
            (err) => console.error("Error loading Wix GLB:", err)
        );

        // --- 4. XR COMMERCE UI SYSTEM ---
        let uiState = 'IDLE'; // IDLE, PROCESSING, SUCCESS
        let isHovered = false;

        const uiGeometry = new THREE.PlaneGeometry(1.2, 0.6);
        const uiMaterial = new THREE.MeshBasicMaterial({ transparent: true });
        const uiMesh = new THREE.Mesh(uiGeometry, uiMaterial);
        
        // Placed below the model so it doesn't obstruct the view of the cool 3D object
        uiMesh.position.set(0, 1.1, -0.9); 
        uiMesh.rotation.x = -Math.PI * 0.15; // Tilted slightly up for readability
        scene.add(uiMesh);

        function generateUITexture(state, hovered) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // SGX Glass Panel Background
            ctx.fillStyle = 'rgba(5, 5, 5, 0.85)';
            ctx.fillRect(0, 0, 1024, 512);

            // 45-degree corner border logic
            ctx.strokeStyle = hovered ? '#00FFFF' : '#32527B';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(40, 10);
            ctx.lineTo(1014, 10);
            ctx.lineTo(1014, 472);
            ctx.lineTo(974, 502);
            ctx.lineTo(10, 502);
            ctx.lineTo(10, 40);
            ctx.closePath();
            ctx.stroke();

            // Sci-fi scanlines effect inside UI
            ctx.fillStyle = 'rgba(0, 255, 255, 0.05)';
            for(let i=0; i<512; i+=8) ctx.fillRect(0, i, 1024, 2);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (state === 'IDLE') {
                ctx.font = 'bold 50px Courier New';
                ctx.fillStyle = '#FFFFFF';
                // Updated Asset Name
                ctx.fillText('ASSET: HIGHCOON HEAD', 512, 120);
                
                ctx.fillStyle = '#FDCC0D';
                ctx.font = 'bold 70px Courier New';
                ctx.fillText('PRICE: 0.25 ETH', 512, 230);

                // Button Area
                ctx.fillStyle = hovered ? '#FDCC0D' : 'rgba(50, 82, 123, 0.5)';
                ctx.beginPath();
                ctx.moveTo(282, 330);
                ctx.lineTo(762, 330);
                ctx.lineTo(762, 430);
                ctx.lineTo(742, 450);
                ctx.lineTo(262, 450);
                ctx.lineTo(262, 350);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = hovered ? '#050505' : '#00FFFF';
                // Adjusted Font Size to fit cleanly within the button bounds
                ctx.font = 'bold 40px Courier New';
                ctx.fillText('AUTHORIZE PURCHASE', 512, 390);

            } else if (state === 'PROCESSING') {
                ctx.font = 'bold 50px Courier New';
                ctx.fillStyle = '#00FFFF';
                ctx.fillText('ENCRYPTING TRANSACTION...', 512, 200);
                
                // Fake progress bar
                ctx.fillStyle = 'rgba(50, 82, 123, 0.5)';
                ctx.fillRect(212, 300, 600, 50);
                ctx.fillStyle = '#FDCC0D';
                ctx.fillRect(212, 300, 400 + Math.random() * 200, 50);

            } else if (state === 'SUCCESS') {
                ctx.fillStyle = '#00FFFF';
                ctx.font = 'bold 70px Courier New';
                ctx.fillText('TRANSACTION SUCCESSFUL', 512, 180);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '40px Courier New';
                ctx.fillText('ASSET SECURED IN VAULT.', 512, 280);
                
                ctx.fillStyle = '#FDCC0D';
                ctx.fillText('REDIRECTING TO SPATIALGINEERS...', 512, 400);
            }

            const texture = new THREE.CanvasTexture(canvas);
            uiMesh.material.map = texture;
            uiMesh.material.needsUpdate = true;
        }

        // Initialize UI
        generateUITexture(uiState, isHovered);

        // --- 5. VR/AR CONTROLLERS & RAYCASTING ---
        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelectStart);
        scene.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelectStart);
        scene.add(controller2);

        const controllerModelFactory = new XRControllerModelFactory();
        
        const grip1 = renderer.xr.getControllerGrip(0);
        grip1.add(controllerModelFactory.createControllerModel(grip1));
        scene.add(grip1);

        const grip2 = renderer.xr.getControllerGrip(1);
        grip2.add(controllerModelFactory.createControllerModel(grip2));
        scene.add(grip2);

        // Laser pointers
        const laserGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
        const laserMaterial = new THREE.LineBasicMaterial({ color: 0x00FFFF, blending: THREE.AdditiveBlending });
        const laser1 = new THREE.Line(laserGeometry, laserMaterial);
        laser1.scale.z = 5;
        controller1.add(laser1);
        
        const laser2 = new THREE.Line(laserGeometry, laserMaterial);
        laser2.scale.z = 5;
        controller2.add(laser2);

        // --- 6. LOGIC & STATE MACHINE ---
        const raycaster = new THREE.Raycaster();
        const tempMatrix = new THREE.Matrix4();

        // --- DESKTOP/TOUCH FALLBACK RAYCASTING ---
        const mouse = new THREE.Vector2();
        const mouseRaycaster = new THREE.Raycaster();

        window.addEventListener('pointermove', (event) => {
            // Ignorar si estamos en VR/AR o si no estamos en la pantalla inicial
            if (renderer.xr.isPresenting || uiState !== 'IDLE') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            mouseRaycaster.setFromCamera(mouse, camera);
            const intersects = mouseRaycaster.intersectObject(uiMesh);

            const currentlyHovered = intersects.length > 0;

            if (currentlyHovered && !isHovered) {
                isHovered = true;
                generateUITexture(uiState, isHovered);
                document.body.style.cursor = 'pointer'; // Cambiar cursor para UX 2D
            } else if (!currentlyHovered && isHovered) {
                isHovered = false;
                generateUITexture(uiState, isHovered);
                document.body.style.cursor = 'default';
            }
        });

        window.addEventListener('pointerdown', (event) => {
            // Ignorar si estamos en VR/AR o si no estamos en la pantalla inicial
            if (renderer.xr.isPresenting || uiState !== 'IDLE') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            mouseRaycaster.setFromCamera(mouse, camera);
            const intersects = mouseRaycaster.intersectObject(uiMesh);

            if (intersects.length > 0) {
                processPurchase();
            }
        });
        // --- FIN FALLBACK ---

        function onSelectStart(event) {
            if (isHovered && uiState === 'IDLE') {
                processPurchase();
            }
        }

        function processPurchase() {
            uiState = 'PROCESSING';
            generateUITexture(uiState, false);

            // Simulate blockchain/network delay
            setTimeout(() => {
                uiState = 'SUCCESS';
                generateUITexture(uiState, false);

                // Redirect trigger
                setTimeout(() => {
                    try {
                        window.location.href = 'https://spatialgineers.com';
                    } catch(e) {
                        console.error('Redirection error:', e);
                    }
                }, 3000);

            }, 2500);
        }

        function getIntersections(controller) {
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObject(uiMesh);
        }

        function updateRaycasting() {
            // Zero Garbage Collection checks
            if (uiState !== 'IDLE') return;

            const intersects1 = getIntersections(controller1);
            const intersects2 = getIntersections(controller2);

            const currentlyHovered = (intersects1.length > 0 || intersects2.length > 0);

            if (currentlyHovered && !isHovered) {
                isHovered = true;
                generateUITexture(uiState, isHovered);
            } else if (!currentlyHovered && isHovered) {
                isHovered = false;
                generateUITexture(uiState, isHovered);
            }
        }

        // --- 7. RENDER LOOP ---
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        renderer.setAnimationLoop((time) => {
            // Smooth Floating & Rotating Animation
            if (loadedModel) {
                loadedModel.rotation.y = time * 0.0003;
            }
            productGroup.position.y = 1.8 + Math.sin(time * 0.0015) * 0.06;

            // Fake progress bar animation during processing
            if (uiState === 'PROCESSING' && Math.random() > 0.8) {
                generateUITexture(uiState, false);
            }

            // Update VR UI Interactions
            if (renderer.xr.isPresenting) {
                document.getElementById('hud').style.display = 'none';
                updateRaycasting();
            } else {
                document.getElementById('hud').style.display = 'block';
            }

            renderer.render(scene, camera);
        });

    </script>
</body>
</html>
