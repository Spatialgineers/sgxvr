<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGX Photobooth Sandbox - Kiosk Compiler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: monospace; display: flex; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        
        #input_video { position: absolute; opacity: 0; pointer-events: none; z-index: -10; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: none; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        /* SGX UI Panel */
        #ui-panel { width: 400px; background: #111; border-left: 2px solid #FDCC0D; display: flex; flex-direction: column; z-index: 10; }
        .panel-header { padding: 20px; background: #1a1a1a; border-bottom: 1px solid #333; }
        .panel-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .sgx-btn { background: #FDCC0D; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 5px; transition: 0.2s; }
        .sgx-btn:hover { background: #fff; }
        .sgx-btn.build { background: #00ffcc; color: #000; margin-top: 10px; font-size: 16px; border: 2px solid #fff; }
        input[type="text"] { background: #222; border: 1px solid #444; color: #FDCC0D; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        /* Layer Styles */
        .layer-card { background: #222; border: 1px solid #333; padding: 10px; border-left: 4px solid #FDCC0D; margin-bottom: 10px; }
        .layer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
        .layer-controls { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-size: 12px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #FDCC0D; }
        .order-btns button { background: #444; color: white; border: none; padding: 4px 8px; cursor: pointer; }
        .order-btns button:hover { background: #FDCC0D; color: black; }
        .del-btn { background: #ff3333; color: white; border: none; padding: 4px 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="ui-panel">
        <div class="panel-header">
            <h2 style="margin:0; color:#FDCC0D;">SGX.FrameBuilder</h2>
        </div>
        <div class="panel-content">
            <div>
                <input type="text" id="imgUrl" placeholder="URL de la imagen (Wix, Drive...)">
                <button class="sgx-btn" onclick="addLayer()">+ Inyectar Asset</button>
            </div>

            <button class="sgx-btn build" onclick="buildKioskApp()">🚀 EXPORTAR APP FINAL</button>
            <div style="font-size: 11px; color: #888; text-align: center;">Genera el HTML limpio con el filtro programado.</div>

            <hr style="border-color: #333; width: 100%;">
            <div id="layers-container"></div>
        </div>
    </div>

    <script>
        // --- 1. SETUP THREE.JS (EDITOR MODE) ---
        const canvas = document.getElementById('output_canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, preserveDrawingBuffer: true, alpha: true });
        renderer.setSize(450, 800); 
        
        const scene = new THREE.Scene();
        const viewSize = 100;
        const aspect = 450 / 800;
        const camera = new THREE.OrthographicCamera(-viewSize*aspect, viewSize*aspect, viewSize, -viewSize, 0.1, 1000);
        camera.position.z = 10;

        // --- 2. CÁMARA (BACKGROUND) ---
        const videoElement = document.getElementById('input_video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { videoElement.srcObject = stream; videoElement.play(); })
            .catch(err => console.error("Error de cámara:", err));

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.center.set(0.5, 0.5);
        videoTexture.repeat.set(-1, 1); 
        scene.background = videoTexture;

        // --- 3. SISTEMA DE CAPAS ---
        let layers = []; 
        let meshGroup = new THREE.Group();
        scene.add(meshGroup);

        function addLayer() {
            const url = document.getElementById('imgUrl').value;
            if (!url) return;

            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin('anonymous'); 
            
            loader.load(url, (texture) => {
                const imgAspect = texture.image.width / texture.image.height;
                const baseWidth = viewSize * aspect * 1.5; 
                
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false });
                const geometry = new THREE.PlaneGeometry(baseWidth, baseWidth / imgAspect);
                const mesh = new THREE.Mesh(geometry, material);
                
                meshGroup.add(mesh);

                const layerData = {
                    id: Date.now(),
                    url: url, // Guardamos URL intacto para la serialización del Build
                    mesh: mesh,
                    scale: 1,
                    baseWidth: baseWidth,
                    imgAspect: imgAspect
                };
                
                layers.push(layerData);
                updateRenderOrder();
                renderUI();
                document.getElementById('imgUrl').value = '';
            });
        }

        function updateRenderOrder() {
            layers.forEach((layer, index) => {
                layer.mesh.renderOrder = index; 
                layer.mesh.position.z = index * 0.1; 
            });
        }

        function removeLayer(index) {
            meshGroup.remove(layers[index].mesh);
            layers[index].mesh.geometry.dispose();
            layers[index].mesh.material.dispose();
            layers.splice(index, 1);
            updateRenderOrder();
            renderUI();
        }

        function moveLayer(index, direction) {
            if (direction === -1 && index > 0) {
                [layers[index], layers[index - 1]] = [layers[index - 1], layers[index]];
            } else if (direction === 1 && index < layers.length - 1) {
                [layers[index], layers[index + 1]] = [layers[index + 1], layers[index]];
            }
            updateRenderOrder();
            renderUI();
        }

        window.updateLayerScale = function(index) {
            const l = layers[index];
            l.scale = parseFloat(document.getElementById(`s-${l.id}`).value);
            l.mesh.scale.set(l.scale, l.scale, 1);
        }

        // --- 4. RAYCASTER DRAG & DROP ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let selectedMesh = null;
        let dragOffset = new THREE.Vector3();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        canvas.addEventListener('pointerdown', (event) => {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(meshGroup.children);
            if (intersects.length > 0) {
                intersects.sort((a, b) => b.object.renderOrder - a.object.renderOrder);
                selectedMesh = intersects[0].object;
                dragOffset.copy(selectedMesh.position).sub(intersects[0].point);
            }
        });

        canvas.addEventListener('pointermove', (event) => {
            if (!selectedMesh) return;
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const target = new THREE.Vector3();
            dragPlane.constant = -selectedMesh.position.z; 
            raycaster.ray.intersectPlane(dragPlane, target);
            selectedMesh.position.x = target.x + dragOffset.x;
            selectedMesh.position.y = target.y + dragOffset.y;
        });

        window.addEventListener('pointerup', () => { selectedMesh = null; });

        function renderUI() {
            const container = document.getElementById('layers-container');
            container.innerHTML = '';
            layers.forEach((layer, index) => {
                const card = document.createElement('div');
                card.className = 'layer-card';
                card.innerHTML = `
                    <div class="layer-header">
                        <span>Layer ${index + 1}</span>
                        <div class="order-btns">
                            <button onclick="moveLayer(${index}, -1)">▼</button>
                            <button onclick="moveLayer(${index}, 1)">▲</button>
                            <button class="del-btn" onclick="removeLayer(${index})">X</button>
                        </div>
                    </div>
                    <div class="layer-controls">
                        <label>Escala</label>
                        <input type="range" id="s-${layer.id}" min="0.1" max="4" step="0.05" value="${layer.scale}" oninput="updateLayerScale(${index})">
                    </div>
                `;
                container.prepend(card); 
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // --- 5. EL COMPILADOR (SGX.System Engine) ---
        function buildKioskApp() {
            // Serializar el estado actual de los layers
            const payload = layers.map(l => ({
                url: l.url,
                x: l.mesh.position.x,
                y: l.mesh.position.y,
                z: l.mesh.position.z,
                scale: l.scale,
                baseWidth: l.baseWidth,
                imgAspect: l.imgAspect,
                renderOrder: l.mesh.renderOrder
            }));

            const payloadString = JSON.stringify(payload);

            // Generar el HTML Standalone con lógica de captura inyectada
            const buildHtml = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGX Interactive Photobooth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; touch-action: none; font-family: sans-serif; }
        #app-container { position: relative; width: 100%; height: 100%; max-width: 500px; aspect-ratio: 9/16; background: #111; display: flex; justify-content: center; align-items: center; }
        #input_video { position: absolute; opacity: 0; pointer-events: none; z-index: -10; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        /* UI de Controles (Kiosk Mode) */
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 100; pointer-events: none; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-size: 24px; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.9); }
        #btn-photo { background: #FDCC0D; }
        #btn-record { background: #ff3333; }
        .recording { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 51, 51, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); } }
    </style>
</head>
<body>
    <div id="app-container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="controls">
            <div class="btn" id="btn-photo" onclick="takePhoto()">📸</div>
            <div class="btn" id="btn-record" onclick="toggleRecord()">🔴</div>
        </div>
    </div>

    <script>
        // Inicializar Motor
        const canvas = document.getElementById('output_canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, preserveDrawingBuffer: true, alpha: true });
        
        // Ajustar resolución dinámica
        const container = document.getElementById('app-container');
        renderer.setSize(container.clientWidth, container.clientHeight);
        
        const scene = new THREE.Scene();
        const viewSize = 100;
        const aspect = container.clientWidth / container.clientHeight;
        const camera = new THREE.OrthographicCamera(-viewSize*aspect, viewSize*aspect, viewSize, -viewSize, 0.1, 1000);
        camera.position.z = 10;

        // Inyectar Cámara
        const videoElement = document.getElementById('input_video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { videoElement.srcObject = stream; videoElement.play(); });

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.center.set(0.5, 0.5);
        videoTexture.repeat.set(-1, 1);
        scene.background = videoTexture;

        // Decodificar el Payload (Los assets de SGX Sandbox)
        const assetsPayload = ${payloadString};
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');

        assetsPayload.forEach(asset => {
            loader.load(asset.url, (texture) => {
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false });
                const geometry = new THREE.PlaneGeometry(asset.baseWidth, asset.baseWidth / asset.imgAspect);
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.set(asset.x, asset.y, asset.z);
                mesh.scale.set(asset.scale, asset.scale, 1);
                mesh.renderOrder = asset.renderOrder;
                scene.add(mesh);
            });
        });

        // Loop de Render
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Lógica de Captura
        function takePhoto() {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = \`SGX_Capture_\${Date.now()}.png\`;
            a.click();
        }

        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];

        function toggleRecord() {
            const btn = document.getElementById('btn-record');
            if (!isRecording) {
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = \`SGX_Video_\${Date.now()}.webm\`;
                    a.click();
                    URL.revokeObjectURL(url);
                    recordedChunks = [];
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = '⬛';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.innerHTML = '🔴';
            }
        }
    <\/script>
</body>
</html>`;

            // Ejecutar la descarga del archivo compilado
            const blob = new Blob([buildHtml], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `SGX_Photobooth_Release_${Date.now()}.html`;
            a.click();
        }
    </script>
</body>
</html>
